workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_TAG =~ /^mpv-/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes: [build.sh, versions.env, verify.py, angle-headers/**/*, smoke/**/*, tools/ci/**/*, .gitlab-ci.yml]
    - when: never

default:
  image: ubuntu:24.04
  tags: [saas-linux-medium-amd64]
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure, api_failure]

stages: [build]
variables:
  TARGET: x86_64-w64-mingw32
  WINEDEBUG: '-all'
  RUN_MODE: native

native-build-and-verify:
  stage: build
  timeout: 2h
  rules:
    - if: '$RUN_MODE == "native"'
  script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends ca-certificates curl git build-essential autoconf automake libtool cmake bzip2 xz-utils zip unzip python3 python3-venv gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 nasm ninja-build pkgconf wine64
    - python3 -m venv /tmp/mbn-native-tools
    - /tmp/mbn-native-tools/bin/pip install meson==1.7.0
    - export PATH="/tmp/mbn-native-tools/bin:$PATH"
    - bash tools/ci/gitlab_native.sh
  artifacts:
    expire_in: 14 days
    paths: [out/]

android-corresponding-sources:
  stage: build
  timeout: 30m
  rules:
    - if: '$RUN_MODE == "android-sources"'
  script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends ca-certificates curl git xz-utils zip python3
    - bash android-sources.sh
  artifacts:
    expire_in: 14 days
    paths: [out/]
