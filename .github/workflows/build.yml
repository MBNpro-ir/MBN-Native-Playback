name: build

# Builds and checks libmpv on every change. A tag named mpv-<version>-r<n> (for example mpv-0.41.0-r1) also publishes
# the build as a release, with its sources.
on:
  push:
    branches: [main]
    tags: ['mpv-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TARGET: x86_64-w64-mingw32
      WINEDEBUG: -all
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 mingw-w64-tools nasm ninja-build pkgconf cmake make \
            python3-venv xz-utils wine64 wine
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet meson==1.7.0
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Build
        run: ./build.sh

      - name: Check it's an LGPL build
        run: python3 verify.py dist

      - name: Smoke test under Wine
        run: |
          $TARGET-gcc-posix -O2 -Idist/include smoke/smoke.c -o dist/smoke.exe -Lwork/prefix/lib -lmpv
          wineboot --init
          (cd dist && wine smoke.exe)
          rm dist/smoke.exe

      - name: Package
        id: package
        run: |
          name="libmpv-lgpl-${GITHUB_REF_NAME//\//-}-x86_64"
          mkdir -p out
          (cd dist && zip -qr9 "../out/$name.zip" .)
          cp sources/sources.tar.xz "out/$name-sources.tar.xz"
          (cd out && sha256sum * > SHA256SUMS)
          cat out/SHA256SUMS
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: out/
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/mpv-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "LGPL libmpv for 64-bit Windows, built from pinned sources. Checked before publishing: mpv built with -Dgpl=false, FFmpeg LGPL, no x264 or x265, and a smoke test that seeks exactly and steps a frame."
            echo
            echo '```'
            cat dist/BUILDINFO.txt
            echo '```'
            echo
            echo 'SHA-256:'
            echo '```'
            cat out/SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" --notes-file notes.md
